steps:
  - name: 'python:3.13-slim'
    id: Test
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q -c constraints.txt -e ".[dev]" &&
        python -m pytest tests/ -q --tb=short -x
    env:
      # Settings.database_url_sync has no default — without it pydantic-settings
      # fails at import of app.config, which breaks conftest collection and
      # (with -x) the whole build. Locally it comes from .env, which is not
      # committed, so the gap only shows up in CI.
      - 'DATABASE_URL=sqlite+aiosqlite:///./test.db'
      - 'DATABASE_URL_SYNC=sqlite:///./test.db'
      - 'API_KEY=test-key'
      - 'ENVIRONMENT=test'

  - name: 'gcr.io/kaniko-project/executor:v1.23.2'
    id: Build
    waitFor: ['Test']
    args:
      - '--dockerfile=Dockerfile'
      - '--context=.'
      - '--destination=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
      - '--cache=true'
      - '--cache-ttl=24h'
      - '--cache-repo=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME-cache'
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:590.0.0-slim
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - '--platform=managed'
      - '--image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
      - '--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID'
      - '--region=$_DEPLOY_REGION'
      # Sized for the synchronous /api/v1/ingest path, which renders pages in
      # headless Chromium (always, for eGO sites). See docs/ego-adapter.md.
      # 4Gi: ~400 MB app baseline + a Chromium per in-flight render. Chromium on
      # an image-heavy listing page runs 500 MB-1 GB RSS, and --disable-dev-shm-usage
      # (playwright_scraper.py) pushes its shared memory into /tmp, which on Cloud
      # Run is a tmpfs billed against this same limit. A container OOM kills the
      # whole instance and every request on it, not just the offending one.
      - '--memory=4Gi'
      # 4Gi requires >= 2 vCPU on Cloud Run; also what Chromium page-load needs.
      - '--cpu=2'
      # 300s: the ingest code's own worst case exceeds 60s. A single render costs
      # up to robots fetch 15s + delay 0.5s + goto 30s + networkidle 3s, and the
      # generic path can render twice (initial fallback + the JS-retry in
      # extract_generic), each a cold browser launch, on top of a static fetch
      # that EthicalScraper allows 120s. 60s truncated real work into 504s.
      - '--timeout=300'
      - '--min-instances=1'
      # Each in-flight ingest owns its own Chromium (a fresh PlaywrightScraper per
      # call — nothing is pooled), so concurrency is a memory bound, not a CPU one.
      # Cloud Run's default of 80 would put ~80 browsers on one 4Gi instance.
      - '--concurrency=3'
      # Concurrency dropped 80 -> 3, so raise the instance ceiling to keep
      # service-wide capacity; idle instances above min-instances cost nothing.
      - '--max-instances=10'
      # CPU only while a request is being served. Scrapes no longer run in this service: they run in
      # the Cloud Run Job below (JOB_DISPATCH_MODE=cloud_tasks). With JOB_DISPATCH_MODE=local they
      # would be starved after the request that started them returns, so set --no-cpu-throttling.
      - '--cpu-throttling'
      - '--cpu-boost'
      - '--quiet'
    id: Deploy
    waitFor: ['Build']
    entrypoint: gcloud
  # Keep the scrape worker (Cloud Run Job, same image) in step with the service. Skipped while the
  # Job does not exist yet (see scripts/setup_scrape_worker.py).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:590.0.0-slim
    id: DeployWorker
    waitFor: ['Deploy']
    entrypoint: bash
    args:
      - -c
      - |
        if gcloud run jobs describe $_WORKER_JOB_NAME --region=$_DEPLOY_REGION >/dev/null 2>&1; then
          gcloud run jobs update $_WORKER_JOB_NAME --region=$_DEPLOY_REGION --quiet \
            --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
        else
          echo "Job $_WORKER_JOB_NAME does not exist yet - skipping"
        fi
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
# _AR_PROJECT_ID and _TRIGGER_ID must be set in the
# Cloud Build trigger via Console or Terraform — do not commit here
substitutions:
  _AR_REPOSITORY: cloud-run-source-deploy
  _PLATFORM: managed
  _SERVICE_NAME: mvp-backend
  _WORKER_JOB_NAME: mvp-scrape-worker
  _TRIGGER_ID: manual  # the trigger overrides it; there is no built-in for the trigger id
  _DEPLOY_REGION: europe-west1
  _AR_HOSTNAME: europe-west1-docker.pkg.dev
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - mvp-backend